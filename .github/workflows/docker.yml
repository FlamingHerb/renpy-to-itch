name: Build and push container image to GitHub Packages
on:
  push:
    tags:
      - "v*"      
  workflow_dispatch:
   
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
    - name: Check out the repo
      uses: actions/checkout@v4
    
    - name: Log in to GitHub Container Registry
      run: echo "${{ secrets.GITHUB_TOKEN }}" | podman login ghcr.io -u ${{ github.actor }} --password-stdin
    
    - name: Extract metadata (tags, labels)
      id: meta
      run: |
        REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
        IMAGE_NAME=ghcr.io/${REPO_LOWER}
        echo "image_name=${IMAGE_NAME}" >> $GITHUB_OUTPUT
        if [[ $GITHUB_REF == refs/tags/* ]]; then
          VERSION=${GITHUB_REF#refs/tags/}
          echo "tags=${IMAGE_NAME}:${VERSION},${IMAGE_NAME}:latest" >> $GITHUB_OUTPUT
        else
          echo "tags=${IMAGE_NAME}:latest" >> $GITHUB_OUTPUT
        fi
    
    - name: Build container image with Podman
      run: |
        IFS=',' read -ra TAG_ARRAY <<< "${{ steps.meta.outputs.tags }}"
        podman build -t "${TAG_ARRAY[0]}" .
        for tag in "${TAG_ARRAY[@]:1}"; do
          podman tag "${TAG_ARRAY[0]}" "$tag"
        done
    
    - name: Push to GitHub Container Registry
      run: |
        for tag in $(echo "${{ steps.meta.outputs.tags }}" | tr ',' ' '); do
          podman push $tag
        done
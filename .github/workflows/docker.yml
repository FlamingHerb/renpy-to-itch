name: Build and push container image to GitHub Packages
on:
  push:
    tags:
      - "v*"      
  workflow_dispatch:
   
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
    - name: Check out the repo
      uses: actions/checkout@v4
    
    - name: Log in to GitHub Container Registry
      run: echo "${{ secrets.GITHUB_TOKEN }}" | podman login ghcr.io -u ${{ github.actor }} --password-stdin
    
    - name: Extract metadata (tags, labels)
      id: meta
      run: |
        IMAGE_NAME=ghcr.io/${{ github.repository_owner }}/renpy-to-itch
        echo "image_name=${IMAGE_NAME}" >> $GITHUB_OUTPUT
        if [[ $GITHUB_REF == refs/tags/* ]]; then
          VERSION=${GITHUB_REF#refs/tags/}
          echo "tags=${IMAGE_NAME}:${VERSION},${IMAGE_NAME}:latest" >> $GITHUB_OUTPUT
        else
          echo "tags=${IMAGE_NAME}:latest" >> $GITHUB_OUTPUT
        fi
    
    - name: Build container image with Podman
      run: |
        podman build -t ${{ steps.meta.outputs.tags }} .
    
    - name: Push to GitHub Container Registry
      run: |
        for tag in $(echo "${{ steps.meta.outputs.tags }}" | tr ',' ' '); do
          podman push $tag
        done
```

**Key changes:**

1. **Uses Podman** - Native Podman commands instead of Docker actions
2. **GitHub Packages** - Pushes to `ghcr.io` (GitHub Container Registry)
3. **GITHUB_TOKEN** - Uses automatic token (no secrets needed)
4. **Permissions** - Added required `packages: write` permission
5. **Tag handling** - Pushes both version tag and `:latest` when tagged

**Your image will be available at:**
```
ghcr.io/<your-username>/renpy-to-itch:latest
ghcr.io/<your-username>/renpy-to-itch:v1.0.0  # (when tagged)